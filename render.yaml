services:
  - type: web
    name: estacion-marte
    runtime: static
    buildCommand: echo "Catalogo Estacion Marte listo"
    staticPublishPath: site
    autoDeployTrigger: commit
    headers:
      - path: /catalog.json
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
